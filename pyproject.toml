[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "AI Agent 研发平台 - 后端运行时（Runtime Contract v1 实现起步）"
requires-python = ">=3.11"
readme = "README.md"

# 生产依赖：锁定精确版本（AGENTS.md 要求：新依赖必须说明理由，生产依赖锁版本）
dependencies = [
    # pydantic v2：用于 Runtime Contract 实体/事件 Schema 的强类型校验（已在
    # src/runtime/common/types.py、src/runtime/event_store/envelope.py 中使用）。
    "pydantic==2.9.2",
    
    # OpenTelemetry：用于 REQ-RT-006 Trace 传播和审计关联的分布式追踪基础设施
    # - opentelemetry-api：标准 Trace/Span API，W3C Trace Context 传播
    # - opentelemetry-sdk：Tracer Provider、采样器、导出器实现
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
]

[project.optional-dependencies]
dev = [
    # pytest：单元测试框架（AGENTS.md §5 测试层级要求的基础工具）
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    # ruff：lint（对应 AGENTS.md 适配区 lint 命令：ruff check .）
    "ruff==0.7.4",
    # mypy：类型检查（对应 AGENTS.md 适配区 typecheck 命令：mypy .）
    "mypy==1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["deprecated"]

[[tool.mypy.overrides]]
module = "deprecated.*"
ignore_errors = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
