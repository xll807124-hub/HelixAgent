[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "AI Agent 研发平台 - 后端运行时（Runtime Contract v1 实现起步）"
# 升级到 Python 3.12 目标（mypy 1.13 需 3.12+ 解析器才能识别 PEP 695 type 语句；
# 当前 .venv 是 3.13.15；2026-10-11 升目标以解决 deprecated 3.0.0 包引发的 mypy syntax 错）
requires-python = ">=3.12"
readme = "README.md"

# 生产依赖：锁定精确版本（AGENTS.md 要求：新依赖必须说明理由，生产依赖锁版本）
dependencies = [
    # pydantic v2：用于 Runtime Contract 实体/事件 Schema 的强类型校验（已在
    # src/runtime/common/types.py、src/runtime/event_store/envelope.py 中使用）。
    "pydantic==2.9.2",
    
    # OpenTelemetry：用于 REQ-RT-006 Trace 传播和审计关联的分布式追踪基础设施
    # - opentelemetry-api：标准 Trace/Span API，W3C Trace Context 传播
    # - opentelemetry-sdk：Tracer Provider、采样器、导出器实现
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",

    # FastAPI：HTTP API 框架（src/api/ 层；对接前端 Web 控制台与外部集成）
    # 兼容 Pydantic 2.9.x 与修复后的 Starlette；2026-10-28 全量回归验证。
    "fastapi==0.135.4",
    # Starlette: pin the patched ASGI dependency used directly by the API.
    "starlette==1.3.1",
    # uvicorn：ASGI 服务器（运行 FastAPI；含 [standard] extras 提供 httptools/uvloop 加速）
    "uvicorn[standard]==0.32.1",
    # python-dotenv：加载 .env 文件（src/api/config.py 用 Pydantic Settings 读取环境变量）
    "python-dotenv==1.2.4",
    # pydantic-settings：Pydantic v2 配置管理（src/api/config.py 读取 AI_API_* 环境变量）
    "pydantic-settings==2.6.1",

    # cryptography：SEC-007 连接器签名验证（X.509 证书链校验、ECDSA/RSA/Ed25519 验签）
    "cryptography==50.0.2",
    
    # aiohttp：SEC-007 HTTP 传输层执行器（HTTPExecutor 通过 HTTP/SSE 调用 MCP 连接器）
    "aiohttp==3.14.5",

    # PyJWT：SEC-007 OAuth 令牌 aud/exp/iss 校验（AC2，防 token passthrough）
    "PyJWT==2.15.1",

    # httpx：SEC-007 OAuth 令牌端点调用（oauth_handler 运行时依赖；同时供 FastAPI TestClient 使用）
    "httpx==0.27.2",
    # W-MODEL: approved local tool-argument JSON Schema validation.
    "jsonschema==4.26.0",
    # requests：OPA 客户端直接使用的运行依赖。
    "requests==2.34.2",
]

[project.optional-dependencies]
# Docker 沙箱 SDK；仅运行容器后端和真实容器集成测试时安装。
sandbox = ["docker==7.1.0"]
dev = [
    # pytest：单元测试框架（AGENTS.md §5 测试层级要求的基础工具）
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.1",
    # ruff：lint（对应 AGENTS.md 适配区 lint 命令：ruff check .）
    "ruff==0.7.4",
    # mypy：类型检查（对应 AGENTS.md 适配区 typecheck 命令：mypy .）
    "mypy==1.13.0",
    # pre-commit：本地 git 钩子框架（AGENTS.md §3 验证顺序自动化）
    "pre-commit==3.8.0",
    # nox：跨平台 Python 任务运行器（AGENTS.md §1 一键验证：nox -s lint/typecheck/test）
    "nox==2024.4.15",
    "pip-audit==2.9.0",
    "bandit==1.9.4",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# 与 pytest.ini 同源：避免双重配置漂移
addopts = ["-ra", "--strict-markers"]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "contract: Harness 契约测试（REQ-HAR-006）",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# 非 Python 工程文件统一从 lint 中排除（pytest.ini 是 INI；YAML/JSON/MD 由专用工具处理）
extend-exclude = [
    "infra/**",
    "docs/**",
    "scripts/**",
    ".vscode/**",
    "*.md",
    "*.ini",
    "*.yaml",
    "*.yml",
    "*.json",
    "Makefile",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# 与 pyproject [project].requires-python 和 .venv 实际 Python 3.13 保持一致：
# mypy 1.13 在 python_version=3.12 下能解析 PEP 695 type 语句（`type` 关键字），
# 这能消除 .venv 内 deprecated 3.0.0 包使用 type 语句引发的 syntax 错。
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
