# pytest 独立配置文件
# 规则（AGENTS.md §1）：本文件与 pyproject.toml [tool.pytest.ini_options] 严格一致；
# CI/本地工具链读取此文件以避免对 pyproject 的隐式依赖。
# 修改请同时同步 pyproject.toml。
# 约束：本轮改动必须保持仓库测试基线（1128 passed, 11 skipped, 0 failed）不退化。

[pytest]
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
# --strict-markers：未声明 marker 报错，避免拼写错；与 pyproject 一致
# 不开 --strict-config：避免与历史测试/插件的隐式约定冲突
# 不强制 filterwarnings=error：避免 PytestCollectionWarning 阻塞 collection
addopts =
    -ra
    --strict-markers
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    contract: Harness 契约测试（REQ-HAR-006）
