name: Security Gate

on:
  push:
    branches: [main, develop, 'feature/**', 'codex/**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: SAST, SCA and Secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and pinned scanners
        run: |
          python -m pip install -e '.[dev,sandbox]'
          python -m pip check
          python scripts/install_security_tools.py
      - name: Validate gate failure paths
        run: python -m pytest -q tests/test_security_gate.py
      - name: Run security gate
        run: python scripts/security_gate.py
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.python-version }}
          path: .security-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
