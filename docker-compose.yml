# docker-compose.yml — 本地开发依赖（DB / Redis）
# 规则（项目开发执行手册 B2.2-1 / B2.2-2 / AGENTS.md §7 供应链）：
#   1) 当前阶段（Walking Skeleton）尚未在代码侧连接 DB/Redis；本文件为开发依赖骨架；
#      实际启用需走 §7 评审后切到固定镜像 tag。
#   2) 敏感配置通过 .env.dev 注入（见 .env.example/.env.dev 模板），禁止硬编码。
#   3) 端口与默认密码仅供本地开发；生产环境另起 helm/terraform（infra/kubernetes、infra/terraform）。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_agent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_agent} -d ${POSTGRES_DB:-ai_agent_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_agent_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
